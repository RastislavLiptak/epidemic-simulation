# Fictional disease with chronic carriers (SICR), like typhoid fever: an acute illness after which
# a few people keep spreading the infection for life while they feel well.
model = "sicr"
initial_infected = 15

[parameters]
# Fitted: with the contact distance below, the acute wave infects about half of the town in the
# first year (the town's contacts are clustered, so this is lower than the mean-field estimate).
transmission = 0.1
# Assumption: bacteria spread through food and water within a room or a kitchen, not only by droplets.
contact_distance = 3.0
# Source: 4 weeks of infectiousness, Pitzer et al. 2014 (PLoS Negl Trop Dis 8:e2642), Table 1.
infectious_days = 28.0
duration_shape = 4.0
# Source: 3-5 % of people infected with Salmonella Typhi develop a chronic infection
# (Gonzalez-Escobedo et al. 2011, Nat Rev Microbiol 9:9-14); 3 % is the low end, and the age effects
# below give Pitzer's 0.3-10.1 %.
carrier_share = 0.03
# Source: carriage for life (Pitzer et al. 2014); the town has no ageing and no natural deaths.
carrier_days = 36500
# Assumption: 0.1; Pitzer et al. fit 0.01 and consider 0.01-0.1 (carriers cause 25-75 % of the
# transmission). Higher than the best fit so that the carriers' effect shows in a run of a few years.
carrier_infectiousness = 0.1
# Source: hospital-based case fatality 2.0 %, range 0-14.8 % (Crump et al. 2008 review).
fatality = 0.02
# Assumption: Pitzer et al. assume 104 weeks of full immunity, which is not lifelong.
immunity_days = 730
immunity_protection = 1.0
# Assumption: typhoid is a severe febrile illness, so most of the ill stay in bed; carriers feel well.
stay_home = 0.5
limit_outings = 0.3
susceptibility_cv = 0.3
# Assumption: the Typhoid Mary effect, a few people spread much more than others (food handlers).
infectiousness_dispersion = 0.5

[age_effects]
# Source: the chance of becoming a carrier rises with age at infection, 0.3 % to 10.1 % of those
# infected (Pitzer et al. 2014, from Ames and Robins 1943); the age bands are an Assumption, the
# factors are those of the range divided by the 3 % of an average person.
branching = [[0, 15, 0.1], [15, 50, 1.0], [50, 120, 3.4]]
# Assumption: the factors only shape the 2.0 % above; young infants and old people die more often.
fatality = [[0, 15, 0.5], [15, 50, 0.7], [50, 65, 1.5], [65, 120, 3.0]]
