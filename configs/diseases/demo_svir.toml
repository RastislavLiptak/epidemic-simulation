# Fictional disease resembling influenza A(H1N1)pdm09 in a town where a part of the people is
# vaccinated (SVIR). The vaccine is leaky: vaccinated people can still be infected, but at a
# lower hazard, and their protection wears off after a few months.
#
# Tags: Source = a published number, Derived = computed from sources, Fitted = tuned to a
# target, Assumption = no source found, Model = a modelling convention.
model = "svir"
initial_infected = 15
enabled = true

[parameters]
# Fitted: with contact_distance 3 m the town gives an effective reproduction number of about 1.4
# for an unvaccinated town (from the final size, about 48 % infected), between the median R of
# seasonal influenza, 1.28, and of the 2009 pandemic, 1.46 (Biggerstaff et al. 2014). The mean-field
# number in the preview is much higher because households and workplaces share their contacts.
transmission = 0.3
contact_distance = 3.0
# Source: 4.8 days of virus shedding (Carrat et al. 2008). With gamma shape 4 the mean time from
# one infection to the infections it causes is 0.625 x 4.8 = 3.0 days, as measured for influenza
# (3.2 days, Chan et al. 2025). There is no latent period in an SVIR model.
infectious_days = 4.8
# Assumption: the usual moderately regular stays of the other demo diseases.
duration_shape = 4.0
# Derived: symptomatic case fatality 0.048 % (Presanis et al. 2009) times 67 % of infections
# being symptomatic (Carrat et al. 2008) is 0.03 % per infection; 0.02 % is taken because the
# estimates based on self-reported illness are 7-9 times lower and Hong Kong found less (Wong et al.
# 2013). Assumption: the exact value between them.
fatality = 0.0002
# Assumption: infection by the same strain protects for years, so for the length of an experiment.
immunity_days = 36500
immunity_protection = 1.0
# Assumption: no source found for behaviour of ill people in influenza; the values of the other
# demo diseases.
stay_home = 0.3
limit_outings = 0.4
susceptibility_cv = 0.3
# Assumption: influenza is not known for superspreading, so everybody infectious spreads equally.
infectiousness_dispersion = 0.0
# Derived: 24 % of the US population vaccinated in the 116 days after the 2009 H1N1 vaccine
# became available (CDC 2010), -ln(1 - 0.24) / 116 = 0.00237 per day, rounded up to 0.0025.
vaccination_rate = 0.0025
# Model: the campaign runs from the first day of the run (the model's default of 30 days is for a
# campaign that starts later).
vaccination_start_day = 0
# Assumption: between 24 % (US, 2009 H1N1 campaign, CDC 2010) and 48 % (US adults, 2023-24 season,
# CDC FluVaxView) already vaccinated when the first cases appear.
initial_coverage = 0.3
# Source: 61 % against influenza A(H1N1)pdm09 (Belongia et al. 2016, 95 % CI 57-65 %).
vaccine_efficacy = 0.61
# Derived: efficacy falls by 6-11 percentage points a month (Ferdinands et al. 2017), so 61 % lasts
# about 7 months; protection kept in full for half of that has the same total.
vaccine_days = 110

[age_effects]
# Source: 34 % of people born before 1950 had protective antibody (haemagglutination-inhibition
# titre of 80 or more) before the pandemic, 4 % of those born after 1980 (titre of 40 or more;
# Hancock et al. 2009); Derived: 1 - 0.34 = 0.66 for people over 65, a cautious figure because of
# the lower threshold used for the young.
susceptibility = [[0, 65, 1.0], [65, 120, 0.66]]
# Assumption: the gradient of the other demo diseases. Source for its direction: the risk of
# death per infection rose from under 1 per 100,000 in children to 1,099 per 100,000 at 60-69 years
# (Wong et al. 2013).
fatality = [[0, 15, 0.1], [15, 50, 0.4], [50, 65, 2.0], [65, 120, 8.0]]
