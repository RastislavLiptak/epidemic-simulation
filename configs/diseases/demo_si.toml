# Fictional lifelong infection that spreads by close contact (SI), like Epstein-Barr virus (EBV) or
# herpes simplex virus 1: once infected, a person carries and spreads the virus for life.
# Real EBV infects well over 90 % of adults (CDC; Croatian survey 91.4 % IgG) and takes years to
# spread, so the TIME SCALE IS COMPRESSED to make the logistic growth visible in a few months:
#   Source:     among initially susceptible West Point cadets 12-31 per 100 were infected per year
#               (Hallee et al., seroepidemiologic study), about 6e-4 per day per susceptible person.
#   Derived:    with about 1.6 contacts per person and about 67 % of them carriers (890 of the
#               1,327 cadets tested on entry had antibody), that is about 5e-4 per day next to
#               one carrier.
#   Fitted:     transmission = 0.1 per day of contact (a hazard of 0.105 per day) is therefore
#               about 200 times faster; it was chosen so that half of the 3,000 people are
#               infected after about 70 days (measured over 8 seeds: 71 days; the town slows
#               the early growth to about 0.5 of the well-mixed rate, see below).
# Because nobody recovers, everybody is infected in the end; the last ones are the people with
# few contacts, mostly the retired (21 of the last 32 in a test run), so the curve flattens slowly.
model = "si"
initial_infected = 15

[parameters]
# Assumption: 2 m, the usual distance for close talking; EBV needs saliva, so it is a generous radius.
# Measured in the default town: 1.56 contacts per person at this distance, 1.20 of them housemates.
# A household is soon fully infected, so only the other 0.36 contacts spread it between households.
contact_distance = 2.0
transmission = 0.1
# Not used: nobody leaves the infectious state, so there is no timed phase.
duration_shape = 4.0
# Assumption: EBV mostly goes unnoticed, so infected people keep their days. A share above 0 would
# isolate that share of carriers for life.
stay_home = 0.0
limit_outings = 0.0
# Assumption: the common default; people differ in how easily they catch it.
susceptibility_cv = 0.3
# Assumption: carriers differ strongly in how much virus they shed; Hadinoto et al. (2009) found the
# EBV load in saliva of healthy carriers varying over 3.5 to 5.5 orders of magnitude in time.
# Gamma shape 1 is a moderately skewed distribution.
infectiousness_dispersion = 1.0
