# Structure of the simulated town: people, households, places and daily schedules.
# Calibrated to the Czech Republic in 2019, the last year before the pandemic, so that it describes
# ordinary life (Eurostat, CZSO), and to the 2021 census for households; see the comments for each part.
# Distances are in meters, hours are hours of the day (0-24), shares are 0-1.
#
# Every number has a reason written next to it. The reason is one of:
#   Source:     a published figure (reference given)
#   Derived:    computed from published figures (the calculation is given)
#   Fitted:     chosen so that the result matches a published figure (named)
#   Assumption: no source found; the comment says why the value is what it is and what it affects,
#               so that it can be replaced when a source is found
#   Model:      a numerical or modelling parameter without a real-world counterpart; the comment
#               says what it does and why this value
# Czech statistics are quoted from the Czech Statistical Office (CZSO, csu.gov.cz). A reference marked
# "search summary" was read from a summary of a search result, not from the document itself.

# ---- People -----------------------------------------------------------------------------------

[age]
# Source: the population of Czechia on 1 January 2019 by single year of age and sex, Eurostat
#   demo_pjan (the file is in data/reference/; everybody from 99 is counted as 99). 2019 is the last
#   year before the pandemic: the 2021 table carries the revision after the census (-199 thousand
#   people against 1 January 2020) and about 45 thousand excess deaths, mostly of the old. The
#   households below are from the 2021 census, which no year before it has. The path is relative to
#   this file.
source = "../data/reference/czechia_population_2019.csv"
# Model: the groups in which the age structure is shown, and the last, open group.
group_width = 5
open_from = 85

[households]
# Household sizes; the census has no size above "7 or more".
# Source: census 2021, 4,813,103 housekeeping households by size: 1,880,336 / 1,421,003 / 701,829 /
#   602,503 / 151,123 / 39,219 / 17,090 with seven or more, 10,359,900 people in all, mean 2.15:
#   https://scitani.gov.cz/size-of-housekeeping-household
# Derived: the people left for the largest group mean 7.67 persons per household, which two sizes
#   reproduce: 33 % of the group have seven people and 67 % eight.
sizes = [1, 2, 3, 4, 5, 6, 7, 8]
weights = [0.39068, 0.29524, 0.14582, 0.12518, 0.03140, 0.00815, 0.00117, 0.00238]
# Model: a household is a few rooms. 0.5 m puts every two members within 1 m of each other, i.e.
#   inside the contact distance of any disease (the smallest allowed is 0.5 m), so a household always
#   infects itself, as a shared dwelling does. A larger radius would split households into people
#   who are not in contact at home.
radius = 0.5                 # members of a household stay within this distance of the home point
# Derived: the mean and the spread of the age of mothers at their first births by year, from the
#   numbers of births by age and order, Eurostat demo_fordagec. Rows: [year, mean, standard deviation].
#   (Eurostat's own indicator AGEMOTH1 is standardised for the age structure; the mean
#   of real first births is the right one here, because real women are drawn.) The first row is
#   Derived as well: before 1995 only the mean age at all births is published (24.7 to 25 in 1975-1992)
#   and in 1995 it was 2.9 years above the first births. A woman uses the row of the year her cohort
#   reached the age of 28, so the women of 60 had their children at about 22 and those of 35 at
#   about 29, which is what makes the ages of parents and children realistic.
first_birth = [[1992, 21.9, 3.8], [1995, 22.9, 3.9], [2000, 24.9, 3.9], [2005, 26.9, 4.3], [2010, 28.1, 4.7], [2015, 28.9, 5.0], [2019, 29.2, 5.0]]
# Assumption: no birth interval is published. The sources found give about 2-3 years
#   (https://www.genderonline.cz/pdfs/gav/2005/01/04.pdf) and the difference between the mean ages at
#   the first and the second birth was 2.4 to 3.2 years in 1995-2021 (Eurostat demo_fordagec), which
#   understates the interval, because the women who have a second child had the first one younger.
#   The mean of 4.0 is above these, as the distribution has a long tail (its median is about 3).
#   It sets how far apart siblings are.
sibling_spacing_mean = 4.0   # years between two children of a mother
# Assumption: no published spread was found. With 2.5 most gaps lie between 1 and 8 years, with a few
#   much longer ones, which are the late children of a new partner; it is what makes 22 % of the
#   births fall to mothers of 35 or more. (The generator never makes a gap shorter than 1.5 years.)
sibling_spacing_sd = 2.5
# Assumption: a biological and legal lower limit; births to mothers under 18 are rare, and the
#   limit only keeps the generator from making impossible households. It is not a fitted value.
parent_age_gap_min = 17      # nobody has a child younger than this
# Source: first marriages 2022, grooms 32.5 and brides 30.3 years on average, a gap of 2.2 years,
#   CZSO, https://www.czso.cz/documents/11260/214798022/s%C5%88atky_2022.pdf (search summary).
#   Marriages stand for all couples; the head of a couple is the man.
partner_age_gap_mean = -2.2  # the woman's age relative to the man's
# Assumption: no published spread found. 4 years means that about a quarter of couples differ by
#   more than 4 years and one in twenty by more than 8, which is what is commonly seen; it only
#   affects how well the ages of partners match.
partner_age_gap_sd = 4.0
# Source: census 2021, 77,060 lone fathers of 508,590 lone parents:
#   https://scitani.gov.cz/type-of-housekeeping-household
lone_father_share = 0.1515
# Derived: 58,167 boys of 113,866 children under one on 1 January 2019 (the age table above).
male_birth_share = 0.511

# Kinds of households. The fit makes the population match these shares of all households.
# Source: census 2021, type of housekeeping household (link above) and the 2021 table of families
#   with dependent children (https://olomouc.eu/administrace/repository/gallery/articles/29_/29533/Paloncyova.cs.pdf,
#   whose totals are the census ones): 2,265,340 couple families, 967,796 of them with dependent
#   children; 508,590 lone parents, 302,438 of them with dependent children; 70,115 households of
#   two or more families; 88,722 multi-person non-family households; 1,880,336 single persons, of
#   them 688 thousand aged 65 or more (https://csu.gov.cz/seniori-v-datech/domacnosti-senioru).
#   Of the people living alone under 65, 263 of 1,067 thousand are 55-64 (Eurostat lfst_hhindws, 2021),
#   and this split of the single persons (alone_older) has to be a target: otherwise the fit, which
#   looks for people of those ages, puts them there.
# Derived: the census does not split the 1,297,544 couples without dependent children into couples
#   alone and couples with a grown-up child at home. Two-person households fix it: their 29.52 % are
#   couples plus the lone parents with one child (61 % of those with dependent children, Eurostat
#   lfst_hhnhtych, and an assumed 80 % of the others) plus flatmates (assumed 85 % of the non-family
#   households), which leaves 20.73 % for couples alone and 6.23 % for couples with grown-up children.
[households.kind_shares]
alone = 0.1867
alone_older = 0.0611
alone_senior = 0.1429
couple = 0.2073
couple_with_children = 0.2011
parent_with_children = 0.0628
couple_with_adult_children = 0.0623
parent_with_adult_children = 0.0428
multigenerational = 0.0146
other = 0.0184

# Kinds by size: where the fit starts from.
# Derived from the shares above: the number of children of couples (40 % one, 48 % two, 11 % three or
#   more) and of lone parents (61 %, 33 %, 6 %) is from Eurostat lfst_hhnhtych 2021. The split of
#   the other kinds over the sizes is an Assumption: grown-up children are usually one (70 %) and
#   households of several families are spread over four and more members. The fit then corrects
#   these numbers towards the census margins, so they only have to be close.
[households.kinds.1]
alone = 0.478
alone_older = 0.156
alone_senior = 0.366
[households.kinds.2]
couple = 0.702
parent_with_children = 0.130
parent_with_adult_children = 0.115
other = 0.053
[households.kinds.3]
couple_with_children = 0.517
couple_with_adult_children = 0.277
parent_with_children = 0.133
parent_with_adult_children = 0.055
other = 0.018
[households.kinds.4]
couple_with_children = 0.791
couple_with_adult_children = 0.127
parent_with_children = 0.029
multigenerational = 0.053
[households.kinds.5]
couple_with_children = 0.670
couple_with_adult_children = 0.112
parent_with_children = 0.005
multigenerational = 0.213
[households.kinds.6]
couple_with_children = 0.70
multigenerational = 0.30
[households.kinds.7]
couple_with_children = 0.50
multigenerational = 0.50
[households.kinds.8]
couple_with_children = 0.50
multigenerational = 0.50

# Age of the household head by kind: weights of 5-year groups starting at the given age.
# Assumption (all shapes): the shapes were chosen to be plausible, they are not published. They only
#   set where each kind of household starts: the households are then reweighted so that the people
#   by age and sex are the published ones (see population.py), so a wrong shape changes the mix of
#   ages inside households but not the age structure of the town. The reasoning:
#   - alone: Derived from people living alone in 2021, Eurostat lfst_hhindws: 60 thousand aged 18-24,
#     632 thousand aged 25-49, 112 thousand aged 50-54;
#   - alone_older: 55 to 64;
#   - alone_senior: from 65, falling as few people reach the oldest ages;
#   - couple (age of the man): a hump of young couples before children come and a larger one of
#     older couples whose children have left;
#   - parent_with_children, couple_with_children: thirties and forties, when children are at home;
#   - with_adult_children: from 40, the parents of grown-up children, up to old parents living with
#     a child;
#   - multigenerational: the grandparents, from 50;
#   - other: young heads (flatmates, siblings), few old ones.
[households.head_age.alone]
start = 20
weights = [0.075, 0.158, 0.158, 0.158, 0.158, 0.158, 0.135]
[households.head_age.alone_older]
start = 55
weights = [0.46, 0.54]
[households.head_age.alone_senior]
start = 65
weights = [0.17, 0.21, 0.22, 0.18, 0.13, 0.07, 0.02]
[households.head_age.couple]
start = 20
weights = [0.02, 0.07, 0.09, 0.06, 0.05, 0.05, 0.06, 0.10, 0.15, 0.15, 0.12, 0.08, 0.04, 0.012, 0.003]
[households.head_age.parent_with_children]
start = 20
weights = [0.01, 0.03, 0.07, 0.14, 0.26, 0.29, 0.16, 0.04]
[households.head_age.couple_with_children]
start = 20
weights = [0.02, 0.09, 0.17, 0.22, 0.23, 0.17, 0.08, 0.02]
[households.head_age.couple_with_adult_children]
start = 40
weights = [0.02, 0.12, 0.22, 0.25, 0.20, 0.12, 0.05, 0.02]
[households.head_age.parent_with_adult_children]
start = 40
weights = [0.02, 0.08, 0.15, 0.20, 0.20, 0.15, 0.10, 0.06, 0.03, 0.01]
[households.head_age.multigenerational]
start = 50
weights = [0.15, 0.25, 0.25, 0.20, 0.10, 0.05]
[households.head_age.other]
start = 20
weights = [0.35, 0.30, 0.15, 0.05, 0.05, 0.04, 0.03, 0.03]

# Ages [lowest, highest] of the children living at home, by kind.
# Source: the census counts as dependent a child in education up to the age of 26; the grown-up
#   children of the other two kinds are of age. Assumption: the upper limit of 60 only excludes the
#   impossible, the age of the mother limits it anyway.
[households.child_ages]
parent_with_children = [0, 25]
couple_with_children = [0, 25]
parent_with_adult_children = [18, 60]
couple_with_adult_children = [18, 60]

[care_homes]
# Derived: people living in homes for the elderly and homes with a special regime, a share of the
#   people of an age. Source: 34.2 thousand clients in homes for the elderly (98 % over 65, 42 %
#   aged 86-95) and 23.6 thousand in homes with a special regime (90 % over 65, 40 % aged 76-85) at
#   the end of 2023, https://csu.gov.cz/seniori-v-datech/zarizeni-socialnich-sluzeb-a-jejich-klienti
#   The remaining age groups are an Assumption (the table could not be read): 66-75 13 % and 25 %,
#   76-85 38 % in homes for the elderly, 86-95 23 % in homes with a special regime, 96+ 5 % and 2 %,
#   which gives 3.0, 10.3, 22.4, 19.8 and 2.2 thousand people, divided here by the people of the age.
#   These people are 0.55 % of the population, 2.5 % of those over 65 and 13 % of those over 85.
rates = [[50, 66, 0.00143], [66, 76, 0.00825], [76, 86, 0.03727], [86, 96, 0.1231], [96, 100, 0.3228]]
# Derived: 519 homes for the elderly with 37 thousand beds and 322 homes with a special regime
#   with 18.9 thousand beds at the end of 2017, 66 per home
#   (https://cdn0.erstegroup.com/content/dam/cz/csas/www_csas_cz/dokumenty/analyzy/Pobytov%C3%A1%20za%C5%99%C3%ADzen%C3%AD%20pro%20seniory_2018_12.pdf).
mean_size = 66
# Assumption: a single room has at least 8 m2 and a shared one 6 m2 per person (decree 505/2006
#   Coll., not opened; search summary), and residents also share corridors and day rooms, hence 16.
#   It sets how many residents are close to each other.
area_mean = 16.0
# Assumption: there is no binding staffing standard (Public Defender of Rights 2023,
#   https://ochrance.cz/uploads-import/ESO/NZ6-2023-NZ-dopln%C4%9Bn%C3%ADMHMP.pdf); homes name one
#   worker for three clients as the goal, which is used. It is the staff present, all at once.
staff_per_resident = 0.33
# Assumption: care is among the most female jobs; the share of women among teachers of the youngest
#   children (below) is taken for it.
staff_female_share = 0.95

[education]
# [from age, to age, share of men, share of women] attending: kindergarten, school and university.
# Derived: pupils and students by single year of age, sex and level (Eurostat educ_uoe_enra02,
#   school year 2018/19, labelled 2019 by Eurostat) divided by the people of that age on 1 January
#   2019 (demo_pjan). The 2021 table is the school year 2020/21, with the closed schools. preschool is
#   ISCED 0, school is ISCED 1-4 and university is ISCED 5-8. Children start school in the September after they turn six, and
#   many start a year later, so half of the 6 year olds are still in kindergarten; upper secondary
#   school ends at 19, so 47 % of the 19 year olds still go to school. Shares over 1 (foreign
#   pupils) are cut to 1; the ages 8 to 14, where attendance is compulsory, are set to 1 (the register
#   of 1 January 2019 still overcounts the population, which makes the ratio 0.97-0.98). Students older
#   than 29 are 15 % of all students (2019), nearly all of them study
#   part time next to a job, and they count as workers.
preschool = [[2, 3, 0.171, 0.182], [3, 4, 0.771, 0.782], [4, 5, 0.869, 0.873], [5, 6, 0.947, 0.940], [6, 7, 0.571, 0.450], [7, 8, 0.024, 0.019]]
school = [[6, 7, 0.421, 0.536], [7, 8, 0.962, 0.981], [8, 15, 1.0, 1.0], [15, 16, 0.990, 0.988], [16, 17, 0.969, 0.970], [17, 18, 0.940, 0.937], [18, 19, 0.860, 0.880], [19, 20, 0.500, 0.436], [20, 21, 0.148, 0.106], [21, 22, 0.067, 0.054], [22, 23, 0.033, 0.031], [23, 24, 0.022, 0.020], [24, 25, 0.014, 0.015]]
university = [[18, 19, 0.010, 0.013], [19, 20, 0.189, 0.299], [20, 21, 0.358, 0.500], [21, 22, 0.336, 0.499], [22, 23, 0.311, 0.460], [23, 24, 0.276, 0.399], [24, 25, 0.223, 0.315], [25, 26, 0.162, 0.215], [26, 27, 0.100, 0.123], [27, 28, 0.065, 0.076], [28, 29, 0.050, 0.058], [29, 30, 0.040, 0.047]]

[employment]
# Source: employment rates 2019 by age and sex, labour force survey, Eurostat lfsa_ergan (2021 is
#   lower for the young and for women, a pandemic dip).
#   [from age, to age, men, women]: the share of all people of the band who have a job. A student
#   has no job here, so those who do not study take up the jobs of the students who work, which
#   leaves the number of people at work right.
rates = [[15, 20, 0.054, 0.051], [20, 25, 0.568, 0.427], [25, 30, 0.903, 0.671], [30, 35, 0.951, 0.605], [35, 40, 0.961, 0.771], [40, 45, 0.954, 0.880], [45, 50, 0.953, 0.918], [50, 55, 0.938, 0.909], [55, 60, 0.886, 0.859], [60, 65, 0.608, 0.339], [65, 70, 0.188, 0.114], [70, 75, 0.077, 0.049], [75, 100, 0.028, 0.011]]
# Source: employed persons usually working from home, Czechia 2019, 4.6 %, Eurostat lfsa_ehomp
#   (7.2 % in 2021 and 6.1 % in 2023, after the pandemic); those who do so sometimes (5.4 % in 2019)
#   are in the absence of workers below.
remote_share = 0.046         # workers who work from home
# Source: the old-age pension age was about 63.5 years in 2021 and retiring up to three years early
#   is possible (Act 155/1995 Coll.), so from 60 somebody without a job is a pensioner.
retired_from = 60
# [the youngest child is under this age, share of the mothers at work].
# Derived: 44.4 % of women aged 25-49 whose youngest child is under 6 had a job in 2019 (Eurostat
#   lfst_hheredch; 42.9 % in 2021), against 89 % of those without children and 97 % of such men (2021).
#   Under-3s are at home:
#   most Czech women return to work when the child is 3 (Politicka ekonomie 2016, 64(6):695-712,
#   https://www.vse.cz/polek/1104; search summary). The split of 44.4 % into the two rows is Fitted:
#   0.20 for under-3s is an Assumption, and 0.88 from 3 is the value for which the validation share of
#   mothers of under-6s at work comes out at 44 % (0.44-0.46 on six seeds).
mother_employment = [[3, 0.20], [6, 0.88]]
# Assumption: the age of a mother of a small child. Almost all births are to women of 18 to 49.
mother_ages = [18, 50]

# ---- Places -----------------------------------------------------------------------------------

[layout]
# Model: a town has a dense centre and a looser edge. 60 % of homes and places are drawn from a
#   normal distribution around the centre and the rest uniformly over the arena. Together with
#   core_spread this makes the centre several times denser than the edge, as in a real town; the
#   exact numbers are not taken from a map.
core_share = 0.6             # share of homes and places placed in the dense town core
# Model: a standard deviation of 16 % of the side puts about 95 % of the core inside a square of
#   64 % of the side, a compact centre that still has room around it.
core_spread = 0.16           # spread of the core as a share of the arena side
# Model: how many random places a person compares when choosing. With few candidates the choice
#   hardly depends on distance, with many the travel distance shrinks and the work grows linearly;
#   12 is enough to prefer nearby places and cheap enough for millions of people.
candidate_sites = 12         # places a person chooses from, weighted by size and distance
# Model: a safety limit so that the arena is not absurdly dense: the check allows people to fill at
#   most half of the town, so at least 50 m2 of town per person (20,000 per km2). Real Czech towns
#   are much looser (Prague: about 1.3 million people on 496 km2, 2,600 per km2), so this is a floor
#   for the arena size, not a statement about density.
min_area_per_person = 25     # the arena needs this much area per person for homes and places
# Model: a guard against a setup in which hundreds of people stand within contact distance of each
#   other at one place, which would make the town one big crowd; it has no real-world meaning.
max_site_contacts = 500      # largest accepted number of people within contact distance at a place
# Assumption: the spread of how socially active people are is not published in the sources found. In
#   contact surveys the number of contacts per person is strongly skewed. 0.5 gives people from about a
#   third to more than twice the average activity, a moderate spread chosen because the factor only
#   multiplies the chance of going out and is not a number of contacts.
sociability_sigma = 0.5      # log-normal spread of how socially active people are (mean 1)

# Places where people spend the day. Mean size (people per place), log-normal spread of sizes,
# distance decay of the choice as a share of the arena side, and the floor space per person: every
# place has its own, drawn from a log-normal distribution (mean in m2, spread).
# Education places are divided into classes of children of the same age; every class has staff,
# recruited from the workers near it (pupils_per_teacher sets how many).
#
# Model, for all places: size_sigma is the log-normal spread of the sizes of places of one kind
#   (0 would make them equal), distance_scale is how quickly the wish to go to a place falls with
#   distance as a share of the arena side, area_sigma is the spread of floor space per person. The
#   order of the values is the reasoning: kindergartens are the most alike (0.3) because of rules on
#   their capacity, schools vary a bit more (0.4), universities more (0.5), and workplaces are fitted
#   (below). Small children go to
#   the nearest place (0.05, then 0.10 for school), adults travel further to work (0.20) and students
#   furthest (0.30). area_sigma is widest for workplaces (0.5), from a workshop to an open office.
#
# preschool
#   mean_size: Source: 360,490 children in 5,349 kindergartens and 16,800 classes in 2021/22 (MSMT,
#     as quoted by https://www.czso.cz/documents/11256/205463776/skolstvi_2021_2022.pdf; search
#     summary), 67 per kindergarten.
#   area_mean: Source: the day room must have at least 4 m2 per child (decree 410/2005 Coll.,
#     https://www.epravo.cz/top/zakony/sbirka-zakonu/sb/2005/410); a legal minimum, so the real mean
#     is a little higher; 4 is kept because the minimum is what kindergartens plan with.
#   class_size: Derived from the same numbers: 21.5 children per class, rounded to 22.
#   class_age_span: Assumption: classes of Czech kindergartens are usually of mixed ages, so a class
#     takes children of 2 to 7 together (schools and universities have classes of one year of age,
#     apart from the few older pupils, who count as the oldest year).
#   pupils_per_teacher: Derived: 367,094 children per 28,302 teachers (Eurostat educ_uoe_perp01 and educ_uoe_enra02, 2019).
#   staff_female_share: Source: 99.5 % of them are women (the same table).
[places.preschool]
mean_size = 67               # 360 thousand children in 5.3 thousand kindergartens
size_sigma = 0.3
distance_scale = 0.05
area_mean = 4.0
area_sigma = 0.25
class_size = 22
class_age_span = 8
pupils_per_teacher = 13.0
staff_female_share = 0.995
# school (basic and upper secondary schools together)
#   mean_size: Derived: 964,571 pupils in 4,238 basic schools and about 430 thousand in 1,285
#     secondary schools in 2021/22 (same source as above), 252 per school.
#   area_mean: Derived: a classroom must have at least 1.65 m2 per pupil (decree 410/2005 Coll.; the
#     4 m2 of the decree apply to practical-work rooms and the playrooms of kindergartens) and is
#     built for the legal maximum of 30 pupils, so 1.65 * 30 / 20 = 2.5 m2 for the mean class.
#   class_size: Derived: 19.3 pupils per class in basic schools (964,571 in 50,050 classes) and about 24 in
#     secondary schools, about 20 together.
#   pupils_per_teacher: Derived: 1.389 million pupils per 98,801 teachers of ISCED 1-3 (Eurostat
#     educ_uoe_perp01 and educ_uoe_enra02, 2019).
#   staff_female_share: Source: 77 % of them are women (the same table).
[places.school]
mean_size = 252
size_sigma = 0.4
distance_scale = 0.10
area_mean = 2.5
area_sigma = 0.25
class_size = 20
class_oldest_age = 19
pupils_per_teacher = 14.1
staff_female_share = 0.77
# university: Assumption for the first three values (no statistic found).
#   mean_size 3000: faculties and campuses, not whole universities, since students attend one
#     building; Czech universities have a few thousand to tens of thousands of students.
#   area_mean 8: lecture halls and seminar rooms give more space per student than classrooms, but
#     students also fill corridors and canteens; twice the school value is a judgement.
#   class_size 40: between a seminar group (about 20-25) and a lecture (over 100); the students that
#     one person actually spends the day close to.
#   pupils_per_teacher 16.8: Derived: 319,343 students per 18,985 teachers of ISCED 5-8 (Eurostat
#     educ_uoe_perp01 and educ_uoe_enra02, 2019).
#   staff_female_share 0.38: Source: the same table.
[places.university]
mean_size = 3000
size_sigma = 0.5
distance_scale = 0.30
area_mean = 8.0
area_sigma = 0.4
class_size = 40
pupils_per_teacher = 16.8
staff_female_share = 0.38
# work:
#   solo_share 0.20: Derived: 1.21 million of the 1.25 million enterprises of the business economy
#     have under 10 persons, 1.14 per enterprise on average (Eurostat sbs_sc_ovw, Czechia 2021), so
#     nearly all of them are one person; in the sectors with a published split, one-person firms
#     hold 34-53 % of the jobs of firms under 10, which is 11-18 % of all jobs, and the
#     counts above give about 25 %. 20 % of the workers work alone, such as tradesmen.
#   mean_size 6, size_sigma 2.4: Fitted, for the other workers, to the employment by size of the same
#     table: 33 % under 10 persons, 7 % 10-19, 10 % 20-49, 18 % 50-249, 31 % 250 or more. Measured
#     in a town of 150,000 people: 32, 7, 11, 21 and 30 %. A very skewed distribution: most firms
#     are tiny and most people work in the few large ones. An enterprise stands for one workplace.
#   area_mean 14: Assumption (the floor space per employee was not found in a source): the usual rule of thumb is 10-25 m2 per employee for offices and workshops;
#     14 is a low-middle value, which makes workplaces fairly dense. It decides how many people sit
#     within a few meters of each other at work, so it is the most important of these values for
#     the contacts at work.
[places.work]
solo_share = 0.20
mean_size = 6
size_sigma = 2.4
distance_scale = 0.20
area_mean = 14.0             # offices and workshops, typically 10 to 25 m2 per employee
area_sigma = 0.5

# ---- Who goes out -----------------------------------------------------------------------------

[outdoors]
# [from age, to age, share]: how much of the outings of an age remain.
# Derived: 1 - the share of people severely limited in usual activities because of health, the mean
#   of 2015-2019 (the yearly values are noisy), Eurostat hlth_silc_12: 9.8 % at 65-74, 18.7 % at
#   75-84, 34.0 % at 85 or more. They are taken as staying in; without it a person of 90 went out as
#   often as one of 66.
going_out = [[65, 75, 0.902], [75, 85, 0.813], [85, 100, 0.660]]
# Assumption: younger children do not go out on their own: they go with their guardian to the same
#   place, at the same time, and do not have favourite places of their own. A child may cycle alone
#   on the road from 10 (Act 361/2000 Coll., section 57), which is a fair mark of independence.
accompanied_under = 10

# ---- Leisure and errands ----------------------------------------------------------------------

# Source: Eurostat HETUS 2020, the harmonised European time use survey (tus_20loc: minutes per person
#   and day by place; tus_20week: by day of the week; tus_20age: by age group; each with time spent
#   and participation time; people aged 10+ in private households, all days of the week). Czechia
#   took part in neither round of the survey, so the values are medians over its neighbours and
#   similar countries whose data were collected in 2022-2025, after the pandemic restrictions:
#   Poland (2023), Hungary (2024-25), Germany (2022), Bulgaria and Croatia (2022-23). The countries
#   that collected data in 2020-21 (Estonia, Finland, Austria, Serbia, Netherlands) are left out
#   because of the pandemic. https://ec.europa.eu/eurostat/cache/metadata/en/tus_20_esms.htm
# Derived: time at each kind of place, minutes per person and day (tus_20loc, medians): shops 19
#   (SHOP), restaurants, cafes and pubs 15 (REST; lunch near work counts here too), the homes of
#   others 28 (HOM_OTH), all other places 66 (OTH: outdoors, sports, culture, services, meetings;
#   range 52-107 in the four countries that report it). The model has them as shopping, food (with
#   lunch), visit and walk; "walk" stands for all other places, with the density of open space.
#   Shops, restaurants and others' homes are matched to a few minutes, other places fall a little
#   short (61, see the cap below). The rest of the day is at home: 78 % of the time spent at the
#   places of the model, against 75-78 % in these countries (tus_20loc, HOM).
# Derived: the length of an outing is the time spent divided by the participation rate, from
#   tus_20week for Monday-Friday and the weekend, weighted 5:2: shopping and services 51 and 69
#   minutes, visits and celebrations 78 and 122, walking, other sports, culture and voluntary work
#   97 and 109. The values below are those in hours. For eating out HETUS gives no length of its
#   own, so 1.5 h stays an Assumption.
# Derived: the chance of an outing is (minutes at the place * age factor * day factor) / length,
#   with the minutes above, an age factor for the role (the time of the age groups of the role,
#   from tus_20age, divided by the time of all ages; roles with several age groups take them
#   equally: school 10-24, university 15-34, workers 25-64, retired 65+ weighted 65:35, homebound
#   and preschool 25-44) and a day factor (weekday or weekend time divided by the weekly mean,
#   tus_20week; for shopping the weekend is Saturday only, because Czech shops are open on Sundays,
#   unlike those in Poland, Hungary and Germany). Fitted: one factor per activity (shopping 1.19,
#   visits 1.17, other places 1.3) so that the model gives the minutes above, which the role and
#   day shape alone, with people drawn at random, did not. Chances are capped at 0.95 (the whole
#   weekend of the "walk" is at the cap: a person has one such outing a day here, in the data
#   some have more). Food: Fitted: the earlier Assumption rows multiplied by 1.4 on weekdays and
#   1.3 at weekends so that food and lunch together give 15 minutes; HETUS has no restaurant
#   visits by age, so the order between roles stays an Assumption.
# The rest of the reasoning for each kind of value:
#   - window: Assumption: the opening hours of the activity (shops 9-19, restaurants in the
#     evening, longer at weekends, walks by day, visits in the afternoon and evening);
#   - duration_shape: Assumption: 3 gives a moderate spread (a few much longer than the mean);
#   - favourites: Assumption: how many regular places a person has: 3 shops, 3 restaurants, 2
#     walking places, 3 families or friends;
#   - mean_regulars: how many people use the same place. Derived for shops and restaurants: the
#     number of places a person knows times the people per place: shops, over 100 thousand in
#     Czechia (https://ipodpora.odbory.info/soubory/dms/wysiwyg_uploads/a05b113e9f39c8af/uploads/Informace-o-kompletnim-CENSU-maloobchodni-site-a-MIKROCENSU-maloobchodni-site-a-stravovani.pdf),
#     are one per 105 people, so 3 * 105 = 315; restaurants and bars, 48,837 enterprises in 2019 (Eurostat
#     sbs_sc_1b_se_r2, I56), are one per 218 people, so 3 * 218 = 654. Assumption for a park (400);
#   - size_sigma, distance_scale, age_scale, area_sigma: Model parameters (spread of the sizes of
#     places, distance decay of the choice, how strongly places keep to one age group, spread of
#     space per person); age_scale is large for shops (40, everybody shops), small for restaurants
#     (14) and visits (12, friends are of similar age);
#   - area_mean: Assumption: space per person present: 9 m2 in a shop, 2.5 m2 in a restaurant
#     (tables are close), 60 m2 in a park (open space);
#   - presence_share: the share of the regulars present at the busiest hour, which sets the floor
#     space of a place. Derived: it is measured from the schedules themselves (the test
#     test_presence_shares_are_the_measured_ones keeps it true).
# Everybody meets somebody: shops, pubs and cafes, walks and visits of family and friends.
# kind "site": regulars choose favourite places (mean number of regulars, spread of sizes,
# distance decay, age scale in years (places favour the ages that typically visit them; smaller
# means more age-segregated), space per person present, share of regulars present at once).
# kind "visit": people visit the homes of friends and relatives, similar in age and nearby.
# probability: chance per day as [weekday, weekend], by role, multiplied by personal sociability.
#   The probabilities follow how much free time a role has: higher at weekends for everybody who
#   works or studies, highest on weekdays for retired and homebound people (they shop and walk when
#   others are at work), lowest for food (not eating out is the usual). Children under
#   `accompanied_under` go with their guardian, so the rows of infants and preschool children hardly
#   matter; residents of care homes stay in and are visited.
[activities.shopping]
kind = "site"
window = { weekday = [9, 19], weekend = [9, 14] }
duration_mean = 0.93
duration_shape = 3
favourites = 3
mean_regulars = 315
size_sigma = 0.8
distance_scale = 0.10
age_scale = 40.0
area_mean = 9.0
area_sigma = 0.4
presence_share = 0.025
[activities.shopping.probability]
homebound = [0.319, 0.45]
preschool = [0.319, 0.45]
school = [0.207, 0.291]
university = [0.287, 0.404]
worker = [0.356, 0.501]
remote = [0.356, 0.501]
retired = [0.446, 0.629]
resident = [0.00, 0.00]

[activities.food]
kind = "site"
window = { weekday = [17, 22], weekend = [11, 22] }
duration_mean = 1.5
duration_shape = 3
favourites = 3
mean_regulars = 654
size_sigma = 0.8
distance_scale = 0.12
age_scale = 14.0
area_mean = 2.5
area_sigma = 0.4
presence_share = 0.026
[activities.food.probability]
homebound = [0.07, 0.13]
