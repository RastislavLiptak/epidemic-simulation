# Visits are to friends of a similar age and to relatives of the next generation (parents, grown-up
# children), who are about a generation older or younger. The visitor is in the host's dwelling (the
# venue of a visit is the host household; see the dwellings of [households]) and goes only to a
# household where somebody is at home: if nobody is at home in the household of today's plan, to
# another favourite household with somebody at home, else the visit is dropped.
# family_share: Derived: the share of the get-togethers with relatives (outside the household)
#   among the get-togethers with relatives and friends. Source: the frequency of getting together
#   with relatives and with friends, Czechia 2015 (EU-SILC ad hoc module, Eurostat ilc_scp09: every
#   day, every week, several times a month, once a month, at least once a year, not in the last 12
#   months; 16-24 years relatives 17.7/33.9/27.9/14.9/4.1/1.5 %, friends 43.0/40.6/12.4/2.9/0.3/0.7 %,
#   and so on for each age group). Assumption: a class counts as 365, 130 (2.5 a week), 30, 12, 4
#   and 0 get-togethers a year; with 2 or 3.5 a week for the weekly class the shares move by 0.01 at
#   most. 16-24: 119 a year with relatives, 214 with friends, 0.36; 25-34 0.48; 35-44 0.57; 45-54
#   0.59; 55-64 0.61; 65-74 0.64; 75+ 0.70. (The share of people who meet relatives every week
#   among those who meet relatives or friends, used before, is a ratio of prevalences, not of
#   get-togethers.) The survey counts all relatives (also siblings and cousins), the model only the
#   next generation, which they mostly are for the old and the young. Assumption: the 16-24 value
#   for 10-15, who are not asked.
# mothers_age_at_birth: Source: the mean age of women at childbirth in Czechia was 24.7 to 27.2
#   years in 1970-2000 (Eurostat demo_find), when the parents of today's adults had them: the mean,
#   25.4. Derived (by the loader): the gap between the generations is this plus half the partner
#   age gap of [households] (partner_age_gap_mean), since fathers are older by that gap and a
#   person visits mothers and fathers alike.
[activities.visit]
kind = "visit"
family_share = [[0, 25, 0.36], [25, 35, 0.48], [35, 45, 0.57], [45, 55, 0.59], [55, 65, 0.61], [65, 75, 0.64], [75, 128, 0.70]]
