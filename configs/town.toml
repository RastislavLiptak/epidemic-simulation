# Structure of the simulated town: people, households, places and daily schedules.
# Calibrated to the Czech Republic in 2019, the last year before the pandemic, so that it describes
# ordinary life (Eurostat, CZSO), and to the 2021 census for households; see the comments for each part.
# Distances are in meters, hours are hours of the day (0-24), shares are 0-1.
#
# Every number has a reason written next to it. The reason is one of:
#   Source:     a published figure (reference given)
#   Derived:    computed from published figures (the calculation is given)
#   Fitted:     chosen so that the result matches a published figure (named)
#   Assumption: no source found; the comment says why the value is what it is and what it affects,
#               so that it can be replaced when a source is found
#   Model:      a numerical or modelling parameter without a real-world counterpart; the comment
#               says what it does and why this value
# Czech statistics are quoted from the Czech Statistical Office (CZSO, csu.gov.cz). A reference marked
# "search summary" was read from a summary of a search result, not from the document itself.
#
# Known gaps (what `python -m epidemic_sandbox.analysis.validate` reports as failing, measured in wave 3;
# nothing here is hidden by a wide tolerance):
#   - people at home at 10 a.m. of a workday (Cesko v pohybu): 0.46 against 0.31 (18-39), 0.44 against
#     0.30 (40-64), 0.81 against 0.62 (65+); the town has too many people at home in the morning:
#     workers are at home at that hour on a third of the days (absence 14 %, days off of weekend
#     workers, late shifts) and those who stay at home do not go out on errands as often as the
#     survey's people do. Whether the survey's "ordinary workday" leaves out days of leave is not known;
#   - contacts of four hours or more at places other than home, work and school: 0.13 and 0.03 a day
#     against 0.25 and 0.17 (POLYMOD): the town has few long social meetings;
#   - household pairs close for 1-4 hours a day: 37 % against the survey's 21 % (see together_share);
#   - contacts of 1 hour or more at home of people over 64: 1.2 against 1.9.
# Households: the shares of [households] are those of the 10.10 million people in the dwellings of the
# 2021 census, but the town puts all people of the 2019 age table outside care homes (10.59 million,
# 4.9 % more) into dwellings, so about 5 % too many live alone (65+: 0.317 against 0.301, 55-64: 0.214
# against 0.205, 25-49: 0.138 against 0.131, measured at 150,000 people).

# ---- People -----------------------------------------------------------------------------------

[age]
# Source: the population of Czechia on 1 January 2019 by single year of age and sex, Eurostat
#   demo_pjan (the file is in data/reference/; everybody from 99 is counted as 99). 2019 is the last
#   year before the pandemic: the 2021 table carries the revision after the census (-199 thousand
#   people against 1 January 2020) and about 45 thousand excess deaths, mostly of the old. The
#   households below are from the 2021 census, which no year before it has. The path is relative to
#   this file.
source = "../data/reference/czechia_population_2019.csv"
# Model: the groups in which the age structure is shown, and the last, open group.
group_width = 5
open_from = 85

[households]
# A household is the people who live in one dwelling, since the dwelling is where they meet each
# other all day and night. The census also counts housekeeping households (people who share
# their expenses); several of them can share one dwelling, so they split real flatmates and the
# old parents living with their children into separate homes (CZSO: of the 688 thousand
# single-person housekeeping households aged 65+, "7 % in a dwelling shared with other
# households"), and they are not used here.
# Source: census 2021, 4,480,139 occupied dwellings by the number of persons living in them:
#   1,597,474 / 1,338,078 / 700,544 / 600,759 / 169,495 / 73,789 with six or more, 10,104,385 persons
#   in all, mean 2.26 (CZSO open data of the census, sldb2021_byty_osoby.csv,
#   https://csu.gov.cz/produkty/vysledky-scitani-2021-otevrena-data).
# Derived: the persons left for the largest group, 478,612, mean 6.486 per dwelling, which two sizes
#   reproduce: 51.4 % of the group have six people and 48.6 % seven.
sizes = [1, 2, 3, 4, 5, 6, 7]
weights = [0.35657, 0.29867, 0.15637, 0.13409, 0.03783, 0.00846, 0.00801]
# Derived: the mean and the spread of the age of mothers at their first births by year, from the
#   numbers of births by age and order, Eurostat demo_fordagec. Rows: [year, mean, standard deviation].
#   (Eurostat's own indicator AGEMOTH1 is standardised for the age structure; the mean
#   of real first births is the right one here, because real women are drawn.) The first row is
#   Derived as well: before 1995 only the mean age at all births is published (24.7 to 25 in 1975-1992)
#   and in 1995 it was 2.9 years above the first births. A woman uses the row of the year her cohort
#   reached the age of 28, so the women of 60 had their children at about 22 and those of 35 at
#   about 29, which is what makes the ages of parents and children realistic.
first_birth = [[1992, 21.9, 3.8], [1995, 22.9, 3.9], [2000, 24.9, 3.9], [2005, 26.9, 4.3], [2010, 28.1, 4.7], [2015, 28.9, 5.0], [2019, 29.2, 5.0]]
# Assumption: no birth interval is published. The sources found give about 2-3 years
#   (https://www.genderonline.cz/pdfs/gav/2005/01/04.pdf) and the difference between the mean ages at
#   the first and the second birth was 2.4 to 3.2 years in 1995-2021 (Eurostat demo_fordagec), which
#   understates the interval, because the women who have a second child had the first one younger.
#   The mean of 4.0 is above these, as the distribution has a long tail (its median is about 3).
#   It sets how far apart siblings are.
sibling_spacing_mean = 4.0   # years between two children of a mother
# Assumption: no published spread was found. With 2.5 most gaps lie between 1 and 8 years, with a few
#   much longer ones, which are the late children of a new partner; it is what makes 22 % of the
#   births fall to mothers of 35 or more. (The generator never makes a gap shorter than 1.5 years.)
sibling_spacing_sd = 2.5
# Assumption: a biological and legal lower limit; births to mothers under 18 are rare, and the
#   limit only keeps the generator from making impossible households. It is not a fitted value.
parent_age_gap_min = 17      # nobody has a child younger than this
# Source: mean age at first marriage in 2019, men 32.0 and women 29.4 years (Eurostat demo_nind,
#   MAGEMAR1 and FAGEMAR1), a gap of 2.6 years. Marriages stand for all couples; the head of a
#   couple is the man.
partner_age_gap_mean = -2.6  # the woman's age relative to the man's
# Fitted: "U 70 procent paru byva starsi muz, v jedne petine zena a ve zbyle desetine jsou
#   novomanzele stejneho veku" (CZSO, https://csu.gov.cz/csu/czso/rostouci-snatecnost-zastavil-koronavirus):
#   with a mean gap of 2.6 years, a spread of 4.0 makes the man older by more than half a year in
#   70 % of couples, the woman in 22 % and the two of an age in 8 %.
partner_age_gap_sd = 4.0
# Source: census 2021, 77,060 lone fathers of 508,590 lone parents:
#   https://scitani.gov.cz/type-of-housekeeping-household
lone_father_share = 0.1515
# Derived: 58,167 boys of 113,866 children under one on 1 January 2019 (the age table above).
male_birth_share = 0.511

# Kinds of households, as shares of the 4,480,139 dwellings. The fit makes the population match them.
# Source: census 2021, type of housekeeping household (https://scitani.gov.cz/type-of-housekeeping-household)
#   and the 2021 table of families with dependent children
#   (https://olomouc.eu/administrace/repository/gallery/articles/29_/29533/Paloncyova.cs.pdf, whose
#   totals are the census ones): 2,265,340 couple families, 967,796 of them with dependent children;
#   508,590 lone parents, 302,438 of them with dependent children; 70,115 households of two or more
#   families; 88,722 multi-person non-family households. Single persons: 1,597,474 dwellings have
#   one person (above); "627,5 tis." people aged 65+ live alone in a dwelling
#   (https://csu.gov.cz/seniori-v-datech/domacnosti-senioru).
# Derived: the 969,974 people living alone under 65 are split by the ages of the people living
#   alone in the labour force survey of 2019 (Eurostat lfst_hhindws, "one adult without resident
#   children": 236.4 of 854.5 thousand aged 18-64 are 55-64), so 268,344 are 55-64 (alone_older; a
#   target, or the fit, which looks for people of those ages, puts them there) and 701,630 younger.
#   The 2,882,665 dwellings of more than one person are 1.7 % fewer than the housekeeping
#   households of more than one person (2,932,767): some of them share a dwelling. Every family kind
#   is scaled by 2,882,665 / 2,932,767 = 0.9829; the single persons who live with others (282,862)
#   join these households as their members, which the sizes above make the fit do.
#   The census does not split the 1,275,377 couples without dependent children into couples alone
#   and couples with a grown-up child at home. Two-person dwellings fix it: their 1,338,078 are
#   couples plus the lone parents with one child (61 % of those with dependent children, Eurostat
#   lfst_hhnhtych, and an assumed 80 % of the others) plus flatmates (assumed 85 % of the
#   non-family households), which leaves 920,514 couples alone and 354,863 with grown-up children.
[households.kind_shares]
alone = 0.15661
alone_older = 0.05990
alone_senior = 0.14006
couple = 0.20547
couple_with_children = 0.21233
parent_with_children = 0.06635
couple_with_adult_children = 0.07921
parent_with_adult_children = 0.04523
multigenerational = 0.01538
other = 0.01947

# Kinds by size: where the fit starts from.
# Derived from the shares above: the number of children of couples (40 % one, 48 % two, 11 % three or
#   more) and of lone parents (61 %, 33 %, 6 %) is from Eurostat lfst_hhnhtych 2021. The split of
#   the other kinds over the sizes is an Assumption: grown-up children are usually one (70 %) and
#   households of several families are spread over four and more members. The fit then corrects
#   these numbers towards the census margins, so they only have to be close.
[households.kinds.1]
alone = 0.478
alone_older = 0.156
alone_senior = 0.366
[households.kinds.2]
couple = 0.702
parent_with_children = 0.130
parent_with_adult_children = 0.115
other = 0.053
[households.kinds.3]
couple_with_children = 0.517
couple_with_adult_children = 0.277
parent_with_children = 0.133
parent_with_adult_children = 0.055
other = 0.018
[households.kinds.4]
couple_with_children = 0.791
couple_with_adult_children = 0.127
parent_with_children = 0.029
multigenerational = 0.053
[households.kinds.5]
couple_with_children = 0.670
couple_with_adult_children = 0.112
parent_with_children = 0.005
multigenerational = 0.213
[households.kinds.6]
couple_with_children = 0.70
multigenerational = 0.30
[households.kinds.7]
couple_with_children = 0.50
multigenerational = 0.50

# Age of the household head by kind: weights of 5-year groups starting at the given age, or of the
# age bands between the given edges.
# Assumption (all shapes): the shapes were chosen to be plausible, they are not published. They only
#   set where each kind of household starts: the households are then reweighted so that the people
#   by age and sex are the published ones (see population.py), so a wrong shape changes the mix of
#   ages inside households but not the age structure of the town. The reasoning:
#   - alone: Source for the bands: thousands of people living alone in 2019, Eurostat lfst_hhindws
#     ("one adult without resident children"): 55.3 aged 18-24, 451.8 aged 25-49, 111.0 aged 50-54;
#     the ages inside a band are equally likely (Assumption);
#   - alone_older: 55 to 64;
#   - alone_senior: from 65, falling as few people reach the oldest ages;
#   - couple (age of the man): a hump of young couples before children come and a larger one of
#     older couples whose children have left;
#   - parent_with_children, couple_with_children: thirties and forties, when children are at home;
#   - with_adult_children: from 40, the parents of grown-up children, up to old parents living with
#     a child;
#   - multigenerational: the grandparents, from 50;
#   - other: young heads (flatmates, siblings), few old ones.
[households.head_age.alone]
edges = [18, 25, 50, 55]
weights = [55.3, 451.8, 111.0]
[households.head_age.alone_older]
start = 55
weights = [0.46, 0.54]
[households.head_age.alone_senior]
start = 65
weights = [0.17, 0.21, 0.22, 0.18, 0.13, 0.07, 0.02]
[households.head_age.couple]
start = 20
weights = [0.02, 0.07, 0.09, 0.06, 0.05, 0.05, 0.06, 0.10, 0.15, 0.15, 0.12, 0.08, 0.04, 0.012, 0.003]
[households.head_age.parent_with_children]
start = 20
weights = [0.01, 0.03, 0.07, 0.14, 0.26, 0.29, 0.16, 0.04]
[households.head_age.couple_with_children]
start = 20
weights = [0.02, 0.09, 0.17, 0.22, 0.23, 0.17, 0.08, 0.02]
[households.head_age.couple_with_adult_children]
start = 40
weights = [0.02, 0.12, 0.22, 0.25, 0.20, 0.12, 0.05, 0.02]
[households.head_age.parent_with_adult_children]
start = 40
weights = [0.02, 0.08, 0.15, 0.20, 0.20, 0.15, 0.10, 0.06, 0.03, 0.01]
[households.head_age.multigenerational]
start = 50
weights = [0.15, 0.25, 0.25, 0.20, 0.10, 0.05]
[households.head_age.other]
start = 20
weights = [0.35, 0.30, 0.15, 0.05, 0.05, 0.04, 0.03, 0.03]

# Ages [lowest, highest] of the children living at home, by kind.
# Source: the census counts as dependent a child in education up to the age of 26; the grown-up
#   children of the other two kinds are of age. Assumption: the upper limit of 60 only excludes the
#   impossible, the age of the mother limits it anyway.
[households.child_ages]
parent_with_children = [0, 25]
couple_with_children = [0, 25]
parent_with_adult_children = [18, 60]
couple_with_adult_children = [18, 60]

# The inside of the dwellings (see world/dwellings.py): a common room (the living room and the
# kitchen, where the household is together) with the bedrooms around it.
[households.dwelling]
# Source: rooms per person in 2019, Czechia (EU-SILC, Eurostat ilc_lvho04): one adult 2.9, one adult
#   with dependent children 1.3; two adults 1.8, with one, two, three or more dependent children
#   1.2, 1.0, 0.8; three or more adults 1.4, with dependent children 1.1 (taken for any number of
#   children). Rows: one, two, three or more adults; columns: no child, one, two, three or more
#   children (under 18). One room is the common room, the others are bedrooms.
rooms_per_person = [[2.9, 1.3, 1.3, 1.3], [1.8, 1.2, 1.0, 0.8], [1.4, 1.1, 1.1, 1.1]]
# Assumption: when together, the household sits at a table or on a sofa group, about 2 m across
#   (4 m2): a room of the dwellings of the census 2021 has about 21 m2 (88.6 m2 on average, from
#   their floor areas in sldb2021_byty_plocha.csv, under 40 m2 290,095; 40-60 788,211; 60-80
#   1,188,305; 80-100 603,270; 100-120 382,228; 120-150 362,571; 150 or more 477,435, counted as
#   180; 3.23 living rooms in sldb2021_byty_mistnosti.csv, plus a kitchen), but the people in it are
#   near each other. A visitor sits there too. With the room's whole floor people were too far apart
#   for the long contacts the survey finds (below).
common_area = 4.0
# Fitted: the share of the time awake at home spent in the common room, the rest in one's own room
#   (whoever comes home goes to one or the other, as the people at home do). The target is the time
#   people spend awake with the members of their household (HETUS 2020, Eurostat tus_20wwhom: with
#   their children, parents, partner or other household members; the median of Germany, Poland,
#   Hungary, Bulgaria and Croatia, everybody of the age including those who live alone): 10-14 6.4 h
#   a day, 15-24 4.3, 25-34 6.3, 35-44 6.9, 45-54 5.8, 55-64 4.8, 65-74 4.8, 75+ 4.3. Measured (a
#   town of 6,000, a week of October 2018) as the time awake at home in the common room with
#   another member there (re-measured in wave 3, three towns of 6,000, seeds 0-2): 0.8 gives
#   5.5 / 4.6 / 4.3 / 4.2 / 3.5 / 3.5 / 4.8 / 3.1 h, which is 0.61 to 1.07 of the survey in every
#   age group and 0.75 of it for everybody of 10 or more (4.1 h against 5.5 h), as it should be: the
#   survey also counts the time spent together away from home (errands, trips, visits), which the
#   town's time at home does not (the band of 0.60 to 1.25 of the survey, in the reference file, is
#   an Assumption: no split by place is published, so the lowest group of 0.61 sits at its edge);
#   0.9 gives 6.5 / 5.6 / 5.1 / 5.0 / 4.2 / 4.3 / 5.9 / 3.9 h, 5.0 h for everybody, and is too much
#   for 15-24 (1.30 of the survey) and 65-74 (1.22), above the band. Check: of the daily contacts at home (the people one lives with), 63 % of the adults'
#   lasted more than 4 hours and 21 % 1-4 hours (POLYMOD, Germany and Poland): of the pairs of a
#   household within 2 m at home a day, 60 % are close for more than 4 h (the survey's 63 % +- 12) and
#   37 % for 1-4 h, more than the survey's 21 % because the model has almost no pair close for less
#   than an hour (4 %, the survey 16 %), see validation.py ("household pairs close").
together_share = 0.8
# Assumption: the two halves of a double bed of 160 cm, the sleepers 0.6 m apart.
bed_gap = 0.6
# Assumption: two beds of a shared bedroom stand along two walls, about 2 m apart.
room_bed_gap = 2.0
# Derived: a dwelling of the census mean floor area (88.6 m2) is about 9.4 m across, so its
#   bedrooms are about half of that from the middle of the common room.
bedroom_distance = 5.0
# Derived: people sleep 8 h 23 min on a weekday (median of Germany, Poland and Croatia, HETUS 2020,
#   Eurostat tus_20week, "sleeping"), here from 22:30 to 6:30, when those who start work at 7 get
#   up (Cesko v pohybu: work begins at 8.0 on average, CDV 2022).
sleep_hours = [22.5, 6.5]
# Assumption: what people do at home (a meal, a programme, a chore) lasts about an hour before they
#   move between the rooms; no time-use episode lengths were found.
dwell_hours = 1.0

[care_homes]
# Residents of homes for the elderly and homes with a special regime: [from age, to age, share of
# the men, share of the women] of an age who live there.
# Source: 35,275 residents of homes for the elderly (8,895 men, 26,380 women) and 19,833 of homes
#   with a special regime (5,921 men, 13,910 women: they add up to 19,831, two fewer than the 19,833 of
#   the table's total, which is why the by-sex sums are 55,106 and the totals 55,108) on 31 December 2019, MPSV, Statisticka rocenka z
#   oblasti prace a socialnich veci 2019, table 6.3
#   (https://www.mpsv.cz/cms/documents/f932ecba-bc00-848b-aaee-38340fdcd81d/Statisticka_rocenka_z_oblasti_prace_a_socialnich_veci_2019.pdf):
#   55,106 adults, 73.1 % of them women.
# Derived: the yearbook has no ages; the only age table is of 2023 (34.2 thousand residents of homes
#   for the elderly, 98 % over 65, 42 % aged 86-95; 23.6 thousand of homes with a special regime, 90 %
#   over 65, 40 % aged 76-85, https://csu.gov.cz/seniori-v-datech/zarizeni-socialnich-sluzeb-a-jejich-klienti),
#   whose remaining age groups are an Assumption (the table could not be read: 66-75 13 % and 25 %,
#   76-85 38 % in homes for the elderly, 86-95 23 % in homes with a special regime, 96+ 5 % and 2 %).
#   These shares of the age groups (5.3 / 17.9 / 38.8 / 34.2 / 3.8 %) are applied to the 55,106
#   residents of 2019, and the residents of an age group divided by the people of the age and sex on
#   1 January 2019 (the age table above), with a woman's rate a constant multiple of a man's of the
#   same age: 1.58, which gives the 40,290 women of 2019. The residents are 0.52 % of the population.
rates = [[50, 66, 0.00105, 0.00166], [66, 76, 0.00609, 0.00962], [76, 86, 0.02850, 0.04501], [86, 96, 0.08273, 0.13069], [96, 100, 0.22911, 0.36191]]
# Derived: 524 homes for the elderly with 36,688 beds and 349 homes with a special regime with
#   20,904 beds in 2019 (the yearbook above, table 6.1), 66 beds per home.
mean_size = 66
# Source: 9,687 of the residents of homes for the elderly and 4,973 of homes with a special regime are
#   permanently bedridden ("trvale upoutani na luzko", the yearbook above, table 6.3): 26.6 % of the
#   55,108. They stay in their room all day, where the staff look after them.
bedridden_share = 0.266
# Assumption: a home is divided into wards with their own day room, dining room and staff; no
#   national figure of their size was found (a position paper of the Nadeje organisation
#   recommends homes "maximalne do 40 luzek" or a division "do mensich useku stavebne i personalne
#   oddelenych", https://www.nadeje.cz/img-content/6/files/stanoviska/stanovisko-kolegia-senior-standard.pdf).
#   24 residents is about one floor of a home of 66 and two or three care workers on the day shift
#   (see the staff below). Mobile residents spend the day in the day room of their ward.
ward_size = 24
# Assumption: a single room has at least 8 m2 and a shared one 6 m2 per person (decree 505/2006
#   Coll., not opened; search summary), and residents also share corridors and day rooms, hence 16 m2
#   of the building per resident. It sets the size of a ward's day room: its residents are as close
#   to each other there as the building's floor space per resident allows.
area_mean = 16.0
# Source: direct care staff of the homes on 31 December 2019 (the yearbook above, table 6.7): homes for
#   the elderly 13,730 care workers ("pracovnik v socialnich sluzbach"), 4,327 nurses and 775
#   orderlies; homes with a special regime 9,458 care workers, 2,932 nurses and 424 orderlies: 31,646
#   for 55,108 residents, 0.574 per resident (head count).
# Derived: of the care workers' jobs of a day, 8 are on the day shift and 3.5 at night ("kazdy den
#   pracuje 11,5 uvazku pracovnika, napr. 8 ve dne a 3,5 v noci", minimum staffing standard of the
#   Karlovy Vary Region, 2022, updated 2023,
#   https://wwwtest.kr-karlovarsky.cz/system/files/2023-12/Minimalni_personalni_standardy.pdf),
#   70 %. The night shift is not modelled (the simulated day ends before midnight), so 0.574 * 8 /
#   11.5 = 0.40 staff per resident work day shifts: a head count, not the number on duty. Each of them
#   is on duty on 45 % of the days less absence (weekly_hours, [staff_absence]), so about 0.16 per
#   resident are on the ward on a day. (Wave 3: the generator had divided this head count by the
#   attendance as well and hired about one carer per resident.)
staff_per_resident = 0.40   # direct care staff (care workers, nurses, orderlies) on day shifts
# Assumption: what residents do in the common room (a meal, television, a chat) lasts about three
#   quarters of an hour before they move to another spot of the room; no time-use episode lengths of
#   residents were found (the dwellings use 1 hour, the places of leisure 0.75).
dwell_hours = 0.75
# Source: a shift may last at most 12 hours (Labour Code 262/2006 Coll., section 83(1)), and day
#   shifts of 12 hours are usual in residential care (e.g. "denni dvanactihodinove smeny", job
#   advertisement of Domov Slunicko Ostrava, 2026). Assumption: the day shift starts at 6, when the
#   night quiet of the homes ends (see day_hours).
shift_hours = [6, 18]
# Source: 37.5 hours a week in continuous operation (Labour Code, section 79(2)(b)). With 12-hour
#   shifts a worker is on 37.5 / 84 = 45 % of the days, every day of the week alike, less the days
#   of leave and sickness of all workers (see [staff_absence]).
weekly_hours = 37.5
# Assumption: care is among the most female jobs; the share of women among teachers of the youngest
#   children (below) is taken for it.
staff_female_share = 0.95
# Source: residents are up and about in the home outside the night quiet, 22:00 to 6:00 ("Doba
#   nocniho klidu je stanovena od 22:00 do 6:00 hodin", house rules of the Nadeje home for the
#   elderly, https://nadeje.cz/wp-content/uploads/2026/01/Domaci-rad-DS.pdf; no national rule).
#   Then the mobile residents are in the day room of their ward; at night everybody is in their room.
day_hours = [6, 22]
# Derived: rooms of the homes at the end of 2019 (the yearbook above, table 6.2): homes for the elderly
#   12,656 single, 10,133 double and 1,468 with three or more beds, homes with a special regime 2,774,
#   6,758 and 1,582. Counting the last group as three beds: 15,430 / 33,782 / 9,150 beds, the
#   shares of the beds in rooms of 1, 2 and 3 beds. Roommates are together at night; rooms are
#   separate venues.
room_bed_shares = [0.264, 0.579, 0.157]
