# ---- Daily schedules --------------------------------------------------------------------------

# Roles follow from age and sex: homebound (infants, the unemployed, mothers of small children),
# preschool, school, university, worker, remote (works from home), retired (60+ and not working),
# resident (of a care home). Workers also work at weekends and on the late shift, see below.
# The windows are the usual day of a role; everybody deviates from them every day (see below).
# Assumption (all windows): typical hours, not taken from a time-use or workplace survey. Why these:
#   - preschool 8-15: kindergartens are open from early morning to the late afternoon, but most
#     children come around 8 and are fetched in the afternoon; the middle of the stay is used;
#   - school 8-14: lessons start at 8 and children leave after four to six lessons (and lunch);
#   - university 9-16: lectures and seminars mostly fall between 9 and 16, with lunch at 12-13;
#   - worker 7-16: Czech offices and factories start early (7-8) and an eight hour day with a break
#     ends at 15:30-16:30; lunch is at noon.
[schedule.preschool.weekday]
work = [8, 15]
[schedule.school.weekday]
work = [8, 14]
[schedule.university.weekday]
work = [9, 16]
lunch = [12, 13]
[schedule.worker.weekday]
work = [7, 16]
lunch = [12, 13]
[schedule.worker.weekend]
work = [7, 16]

# Source: employed persons working on Saturdays and Sundays, Czechia 2019, Eurostat lfsa_ewpsat and
#   lfsa_ewpsun: usually 15.8 % and 11.6 %, sometimes 21.3 % and 14.0 %; the shares are the means of
#   the two days, as the simulation has one kind of weekend day.
# Assumption: "usually" means at least half of those days and "sometimes" fewer, so somebody works
#   three of four and one of four. Whoever works at weekends has as many weekdays off.
[weekend_work]
usual_share = 0.137
sometimes_share = 0.177
usual_chance = 0.75
sometimes_chance = 0.25

# Source: 10.2 % of employed persons usually work in the evenings, Czechia 2019, Eurostat lfsa_ewpeve.
#   They work a shift from 14 to 22. Model: the 5.4 % who usually work at night (lfsa_ewpnig) are
#   counted among them, since the day of the simulation ends before midnight.
[late_shift]
share = 0.102
start_hours_later = 7.0
end_hours_later = 6.0

# Chance per day that a person goes out for the lunch break instead of staying at work.
# Assumption: no survey found. Students (0.5) have no canteen at their desk and often eat out;
#   workers (0.3) mostly eat in a canteen or at their desk and go out less. It decides how many
#   people from different workplaces meet at lunch.
[lunch_probability]
university = 0.5
worker = 0.3

# Source: the Labour Code (262/2006 Coll., section 88) gives a break for food and rest of at least
#   30 minutes after six hours of work; 0.75 h (45 minutes) is the middle of the usual 30-60.
[lunch]
duration_mean = 0.75

# How individual people deviate from the usual day, by role: days off (leave, illness, home office),
# habitual early or late starters and finishers (fixed per person, in hours), daily scatter and
# overtime.
# worker absence: Derived: 8 % statutory minimum leave (4 weeks of 20 working days in a year of about
#   250, Labour Code 262/2006 Coll.) plus 4.70 % sick leave (81.2 million days of 4.73 million insured persons in
#   2019, CZSO table of temporary incapacity for work; search summary, the 2023 value is 4.57 %,
#   https://csu.gov.cz/docs/107508/6fc493ad-ff85-db87-45d7-4141ef16965f/26000423p2t01.pdf)
#   plus 1.35 % days at home of those who work from home sometimes (5.4 % of the employed in 2019,
#   Eurostat lfsa_ehomp, on an assumed quarter of their days) is 14 %. Public holidays are in the
#   calendar and the days off of weekend workers are added for each person.
# Assumption for all other values of this group. Why these:
#   - absence of school (5 %), preschool (8 %) and university (15 %): children are ill more often than
#     adults, small children most (so 8 % in kindergarten), and university attendance is voluntary
#     (so 15 %); holidays are in the calendar, so this is illness in term time;
#   - start_personal_sd, end_personal_sd (hours): how far a person's usual times differ from the
#     role's. Workers have flexible hours (0.9 h), school start is fixed by the bell (0.1 h) but the
#     end varies with the timetable and after-school clubs (0.6 h), kindergarten children come and
#     are fetched at different times (0.5 and 0.8 h), students' timetables differ most (1.0 and 1.5 h);
#   - start_daily_sd, end_daily_sd (hours): day-to-day scatter around a person's habit, smaller than
#     the personal differences (0.15-0.5 h), because a person is more regular than people are alike;
#   - overtime_probability 0.12 and overtime_mean 1.2 h (workers only): about one day in eight is a
#     longer one, by an hour or so.
[variability.worker]
absence = 0.14
start_personal_sd = 0.9
start_daily_sd = 0.25
end_personal_sd = 0.9
end_daily_sd = 0.4
overtime_probability = 0.12
overtime_mean = 1.2
[variability.school]
absence = 0.05
start_personal_sd = 0.1
start_daily_sd = 0.15
end_personal_sd = 0.6
end_daily_sd = 0.2
[variability.preschool]
absence = 0.08
start_personal_sd = 0.5
start_daily_sd = 0.3
end_personal_sd = 0.8
end_daily_sd = 0.3
[variability.university]
absence = 0.15
start_personal_sd = 1.0
start_daily_sd = 0.4
end_personal_sd = 1.5
end_daily_sd = 0.5

# ---- Calendar ----------------------------------------------------------------------------------

# Dates are "MM-DD", the same every year; a range may run over the new year.
[calendar]
# Model: the first day of a run, an ordinary Monday of the school term of the last school year before
#   the pandemic, 2018/19 (2021/22, the census school year, had restrictions at schools and two public
#   holidays fewer on weekdays). The year sets on which weekdays the holidays fall. A run starts on a
#   Monday, and when it starts decides how soon it meets the holidays.
first_day = "2018-09-10"
# Source: Act 245/2000 Coll.: the thirteen public holidays. Easter (Friday and Monday) moves; the
#   dates are those of 2019. A holiday is a day off as on a weekend.
public_holidays = ["01-01", "04-19", "04-22", "05-01", "05-08", "07-05", "07-06", "09-28", "10-28", "11-17", "12-24", "12-25", "12-26"]
# The days a place is closed, with its pupils and staff at home.
[calendar.closures]
# Source: school year 2018/19, MSMT (decree 16/2005 Coll.): autumn holidays 29 and 30 October, Christmas
#   22 December to 2 January, half-year holiday 1 February, Easter holiday 18 April, summer 1 July to 31
#   August. The spring holiday is a week that differs by district; 4-10 February is one of them.
school = [["10-29", "10-30"], ["12-22", "01-02"], ["02-01", "02-01"], ["02-04", "02-10"], ["04-18", "04-18"], ["07-01", "08-31"]]
# Assumption: kindergartens have no statutory holidays; they usually close over Christmas and for a
#   few weeks in the summer, when also most children stay at home.
preschool = [["12-23", "01-02"], ["07-18", "08-21"]]
# Assumption: the usual academic year of Czech universities: teaching from the second half of September
#   to Christmas and from mid February to mid May; students stay away in the exam periods.
university = [["12-23", "02-13"], ["05-16", "09-19"]]

# ---- Travel -----------------------------------------------------------------------------------

# Everybody travels the way suits them: the mode depends on age and on how far the usual trip is.
# Speeds are door to door in a town, in km/h; each person's speed varies around the mode's.
# Assumption (speeds, mixes by age, speed_sigma): typical urban values, not taken from a travel
#   survey with age and mode, which could not be found. As a plausibility check, over 60 % of Czech
#   commuters travel by car (census, quoted by https://www.seznamzpravy.cz/clanek/domaci-zivot-v-cesku-proc-se-vic-nez-pulka-cechu-nejcasteji-dopravuje-autem-nekde-to-jinak-nejde-249765).
# Model, for the distances: they set how far a mode stops being suitable. Walking is likely up to
#   about 1.5 km and rare far beyond it, cycling suits up to about 6 km, public transport and cars
#   do not pay off for short trips (800 m and 500 m, the time to get to the stop or park), and become
#   likelier the longer the trip.
# speed_sigma 0.15: people differ in speed by about 15 % around the mode's value.
[travel]
speed_sigma = 0.15
walk_distance = 1500         # meters; walking gets rare beyond this
bike_distance = 6000
transit_distance = 800       # public transport and cars need some distance to pay off
car_distance = 500
# Assumption, door to door (including waiting, parking and crossings, which is why they are lower
#   than the speed of the vehicle): walking 4.5 km/h (a free walking speed is about 5 km/h), cycling
#   13 km/h, public transport 16 km/h (about 20 km/h on the line, less with the walk to the stop and
#   waiting) and the car 28 km/h (town traffic, with the search for parking).
[travel.speed]
walk = 4.5
bike = 13.0
transit = 16.0
car = 28.0
# Assumption (mixes): the shares of the modes for a trip that suits all of them. Children under 15
#   mostly walk or are taken (walk 0.45, a car 0.20, buses 0.27 for older children), adults mostly
#   drive (0.54, as most commuters do) and a quarter use public transport, seniors drive less (0.30)
#   and walk and use public transport more (0.35 and 0.32). Cycling is rare for everybody (0.03-0.08).
[travel.mix.child]           # under 15
walk = 0.45
bike = 0.08
transit = 0.27
car = 0.20
[travel.mix.adult]
walk = 0.15
bike = 0.06
transit = 0.25
car = 0.54
[travel.mix.senior]          # 65 and over
walk = 0.35
bike = 0.03
transit = 0.32
car = 0.30
