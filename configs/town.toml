# ---- Places -----------------------------------------------------------------------------------

[layout]
# Model: a town has a dense centre and a looser edge. 60 % of homes and places are drawn from a
#   normal distribution around the centre and the rest uniformly over the arena. Together with
#   core_spread this makes the centre several times denser than the edge, as in a real town; the
#   exact numbers are not taken from a map.
core_share = 0.6             # share of homes and places placed in the dense town core
# Model: a standard deviation of 16 % of the side puts about 95 % of the core inside a square of
#   64 % of the side, a compact centre that still has room around it.
core_spread = 0.16           # spread of the core as a share of the arena side
# Model: how many random places a person compares when choosing. With few candidates the choice
#   hardly depends on distance, with many the travel distance shrinks and the work grows linearly;
#   12 is enough to prefer nearby places and cheap enough for millions of people.
candidate_sites = 12         # places a person chooses from, weighted by size and distance
# Model: a safety limit so that the arena is not absurdly dense: the check allows people to fill at
#   most half of the town, so at least 50 m2 of town per person (20,000 per km2). Real Czech towns
#   are much looser (Prague: about 1.3 million people on 496 km2, 2,600 per km2), so this is a floor
#   for the arena size, not a statement about density.
min_area_per_person = 25     # the arena needs this much area per person for homes and places
# Model: a guard against a setup in which hundreds of people stand within contact distance of each
#   other at one place, which would make the town one big crowd; it has no real-world meaning.
max_site_contacts = 500      # largest accepted number of people within contact distance at a place
# Assumption: the spread of how socially active people are is not published in the sources found. In
#   contact surveys the number of contacts per person is strongly skewed. 0.5 gives people from about a
#   third to more than twice the average activity, a moderate spread chosen because the factor only
#   multiplies the chance of going out and is not a number of contacts.
sociability_sigma = 0.5      # log-normal spread of how socially active people are (mean 1)
# Assumption: at the places of errands and leisure (shops, restaurants, parks, the lunch break),
#   how long a person stays at one spot before moving to another (a shelf, a path); no measurement
#   was found. Schools, workplaces, care homes and dwellings have their own values below.
dwell_hours = 0.75

# Places where people spend the day. Mean size (people per place), log-normal spread of sizes,
# distance decay of the choice as a share of the arena side, and the floor space per person: every
# place has its own, drawn from a log-normal distribution (mean in m2, spread).
# Inside, a place has rooms (the classes of a school, the rooms of the teams of a workplace), each a
# venue of its own, and a common area (corridors, canteen, kitchen, meeting rooms), where its people
# spend `common_share` of their stay, as crowded as the rooms. Pupils of basic and secondary
# schools and workers have a fixed seat or desk, to which they come back from the common area;
# children of kindergartens and university students move about their room (`dwell_hours`).
#
# common_share of the schools: Fitted: the share of their time at school that a class spends in the
#   common rooms (corridors, canteen), all its pupils together, as crowded as the classes. The
#   targets: children of grades 1-5 spent 3.2 times as much face-to-face time with their
#   classmates as with children of other classes (Stehle et al. 2011, PLoS ONE 6:e23176, "three
#   times" in the text, 3.2 from its Table 3, 2.4 to 5.3 in the ten classes; 79 % of the time across
#   classes at lunch), and the contacts at school lasting 4 hours or more (POLYMOD, Germany and
#   Poland, 2.96 per pupil of 5-19 and day). Measured within 1.5 m and 2 m in a town of 6,000 (a week
#   of October 2018): 0.23 gives 8.6 times and 2.88 contacts, 0.27 4.6 and 2.40, 0.30 4.4 and 2.26,
#   0.35 3.5 and 1.74, 0.50 2.0. Seated pupils are within 1.5 m of their neighbours all lesson
#   long, which the face-to-face sensors of the study did not count as fully, so the time with
#   classmates comes out higher; 0.30 keeps both within their ranges. Check not used in the fit: a
#   Czech school morning of five 45-minute lessons has 45 minutes of breaks (decree 48/2005 Coll.,
#   section 1(5): at least 10 minutes, one of 15) and about half an hour of lunch (86.8 % of the
#   pupils of basic schools eat in the school canteen, MSMT 2018/19), 25 % of the time out of
#   class. Assumption: the same share for kindergartens and universities, which were not measured.
#
# seats of basic and secondary schools [gap between the two seats of a double desk, gap between
#   the desks of a row, gap between the rows] (m): Source: a double school desk is 130 cm wide and
#   50 cm deep (CSN EN 1729-1 sizes, as sold for Czech schools; search summary), so desk-mates sit
#   0.65 m apart; Assumption: an aisle of 0.6 m beside each desk (1.9 m from desk to desk) and 0.6 m
#   for the chair between the rows (1.1 m), the usual classroom of rows facing the board. Pupils keep
#   their seat during the lessons and leave it only for the common rooms.
#
# Teachers: Derived from the school statistics of 2018/19 (CZSO, Skoly a skolska zarizeni 2018/2019,
#   tables 1, 26 and 61, https://csu.gov.cz/produkty/skoly-a-skolska-zarizeni-skolni-rok-20182019;
#   full-time equivalents): the classes of the first stage of a basic school (ages 6-10, 28,759
#   classes of 573,442 pupils with 32,830 teachers) have a class teacher of their own, as the
#   teachers per class (1.14) allow; the classes of the second stage (367,486 pupils, 31,516
#   teachers: 11.7 pupils per teacher) and of secondary schools (420,814 pupils, 38,223 teachers:
#   11.0) are taught by teachers who go from class to class, one in a class at a time. A teacher
#   teaches 22 lessons a week (Government Order 75/2005 Coll., annex, item 2.1), the pupils have 28-
#   32: the teachers without a class sit in the staff room (the common area). The classes of a
#   kindergarten (22.6 children, 11.9 per teacher) have two teachers who take turns in shifts.
#   staff_hours: Assumption: teachers work 40 hours a week (Act 563/2004 Coll., section 22a), of
#   which they are at school from half an hour before the lessons until the afternoon; the rest
#   (preparation) may be done elsewhere.
#
# Model, for all places: size_sigma is the log-normal spread of the sizes of places of one kind
#   (0 would make them equal), distance_scale is how quickly the wish to go to a place falls with
#   distance as a share of the arena side, area_sigma is the spread of floor space per person. The
#   order of the values is the reasoning: kindergartens are the most alike (0.3) because of rules on
#   their capacity, schools vary a bit more (0.4), universities more (0.5), and workplaces are fitted
#   (below). Small children go to the nearest place (0.05, then 0.10 for basic school), secondary
#   schools serve a wider area (0.30, Assumption: a town has few, each with its own fields of
#   study), adults travel further to work (0.20) and students furthest (0.30). area_sigma is widest
#   for workplaces (0.5), from a workshop to an open office.
#
# preschool
#   mean_size: Derived: 363,776 children in 5,287 kindergartens and 16,064 classes in 2018/19 (CZSO,
#     table 1 above), 68.8 per kindergarten.
#   area_mean: Source: the day room must have at least 4 m2 per child (decree 410/2005 Coll.,
#     https://www.epravo.cz/top/zakony/sbirka-zakonu/sb/2005/410); a legal minimum, so the real mean
#     is a little higher; 4 is kept because the minimum is what kindergartens plan with.
#   class_size: Derived from the same numbers: 22.6 children per class.
#   class_age_span: Assumption: classes of Czech kindergartens are usually of mixed ages, so a class
#     takes children of 2 to 7 together (schools and universities have classes of one year of age,
#     apart from the few older pupils, who count as the oldest year).
#   pupils_per_teacher: Source: 11.9 children per teacher (full-time equivalents; the same table).
#   staff_female_share: Source: 99.5 % of them are women (Eurostat educ_uoe_perp01, 2019).
#   staff_shifts: Derived: a kindergarten teacher teaches 31 hours a week (Government Order 75/2005
#     Coll., annex), 6.2 hours a day, and the two teachers of a class work together at least 2.5
#     hours a day (MSMT, the financing of kindergartens: "prekryvani PPc ucitelu v rozsahu minimalne
#     2,5 hodiny denne v kazde tride"; search summary): a morning and an afternoon shift. The
#     teaching is part of a working day of 8 hours at the workplace (40 hours a week, Labour Code
#     262/2006 Coll., section 79(1)); two such shifts cover the whole opening of the kindergarten
#     (childcare.kindergarten_hours 6 to 18, Assumption) and overlap by 4 hours, above the 2.5
#     required. (Wave 3: shifts of 6.5 hours left the children without a teacher from 17 to 18.)
#   dwell_hours: Assumption: small children change their play every quarter of an hour or so.
[places.preschool]
mean_size = 68.8
size_sigma = 0.3
distance_scale = 0.05
area_mean = 4.0
area_sigma = 0.25
class_size = 22.6
class_age_span = 8
pupils_per_teacher = 11.9
staff_female_share = 0.995
common_share = 0.30
dwell_hours = 0.25
class_teacher_until = 99
staff_shifts = [[6.0, 14.0], [10.0, 18.0]]
