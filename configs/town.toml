accompanied_under = 10

# ---- Leisure and errands ----------------------------------------------------------------------

# Source: Eurostat HETUS 2020, the harmonised European time use survey (tus_20loc: minutes per person
#   and day by place and activity; tus_20week: by day of the week; tus_20age: by age group; time
#   spent, participation time and participation rate; people aged 10+ in private households, all
#   days of the week). Czechia took part in neither round of the survey, so the values are medians
#   over its neighbours and similar countries whose data were collected in 2022-2025, after the
#   pandemic restrictions: Poland (2023), Hungary (2024-25), Germany (2022), Bulgaria and Croatia
#   (2022-23). The countries that collected data in 2020-21 (Estonia, Finland, Austria, Serbia,
#   Netherlands) are left out because of the pandemic. Hungary codes the homes of others,
#   restaurants and other places as "not specified", so those medians are over four countries.
#   https://ec.europa.eu/eurostat/cache/metadata/en/tus_20_esms.htm
# Derived: time at each kind of place, minutes per person and day (tus_20loc, medians), without the
#   personal care spent there (sleeping over, also the meals, which tus_20loc does not split from
#   it), so daytime outings only:
#   - shops 19 (SHOP: DE 18, PL 27, HU 21, BG 19, HR 14) -> shopping;
#   - restaurants, cafes and pubs 15 (REST, nearly all eating) -> food and the lunch break;
#   - the homes of others 19.5 (HOM_OTH 55/32/22/25 minus personal care 21/11/7/7) -> visit;
#   - other places by activity (OTH): sports and outdoor activities 24.5 (30/24/15/25) -> outdoor;
#     household and family care there, which is mostly services (doctor, post office, hairdresser,
#     offices) 13 (12/15/8/14) -> services; voluntary work and meetings, social life and
#     entertainment, hobbies 18.5 (34/17/20/14) -> culture (and meetings, church, clubs).
#   The rest of the day is at home.
# Derived: the length of an outing is the time spent on its activity divided by its participation
#   rate, by day type (tus_20week, medians; participation rates of two activities added): shopping
#   and services 0.84 h on weekdays, 1.13 h on Saturdays (shops, which are open in Czechia also on
#   Sundays, unlike in Poland, Hungary and Germany, so Saturday stands for the weekend) and 1.03 h
#   at weekends (services); visits and celebrations 1.42 and 2.11 h; walking, hiking and other
#   sports 1.45 and 1.73 h; entertainment, culture, voluntary work and meetings 2.00 and 2.13 h.
#   For eating out HETUS gives no length of its own, so 1.5 h stays an Assumption.
# Derived: the chance of an outing is (minutes at the place * age factor * day factor) / length,
#   with the minutes above, an age factor for the role (the time of the age groups of the role,
#   from tus_20age, divided by the time of all ages; roles with several age groups take them
#   equally: school 10-24, university 15-34, workers 25-64, retired 65+ weighted 65:35, homebound
#   and preschool 25-44) and a day factor (weekday or weekend time divided by the weekly mean,
#   tus_20week). Fitted: one factor per activity, so that the time at the places in the town (the
#   engine, people 10+ outside care homes, 2 towns of 8,000, 10 weeks over the year, with the trip
#   times of [travel]) is the minutes above: shopping 0.992, services 1.095, outdoor 1.119, culture
#   1.185, visits 1.134 (visits of households with nobody at home are dropped, outings that do not
#   fit into the day too), food 1.114 (with the lunch break). Food: Fitted:
#   the earlier Assumption rows scaled so that food and lunch together give 15 minutes; HETUS has
#   no restaurant visits by age, so the order between roles stays an Assumption. Chances are capped
#   at 0.95.
# Source, when outings begin on weekdays (Kouril, Simecek, Dytrt 2022, Cesko v pohybu: national
#   travel survey of the Transport Research Centre, one workday of everybody aged 6+ in 9,000
#   households, 2017-2019, Tables 34 and 37-39, by purpose,
#   https://rstudio.cdvinfo.cz/shiny/downloads/publikace/2022_Kouril-Simecek-Dytrt_Cesko-v-pohybu.pdf):
#   start_mean is the mean hour of the beginning ("hodina zacatku"), start_peak the hour with the
#   most people out on it ("maximum, hodina"): nakup (shopping) for under 18 14.0 and 16, the
#   economically active 18-64 14.3 and 16, the inactive 18-64 11.1 and 10, 65+ 10.7 and 10;
#   zarizovani (errands, services) 12.8 and 9, 12.6 and 10, 10.8 and 10, 10.8 and 10; volny cas
#   (leisure: the outdoor, culture and visits here) 14.8 and 16, 15.7 and 17, 14.1 and 14, 13.3
#   and 14. Roles: school and preschool take the under 18, workers and remote workers the active,
#   homebound and university students the inactive (the survey counts students as inactive), the
#   retired the 65+. Model: the beginnings are triangular, from the opening of the window, most
#   often where the outings are under way at the middle of the peak hour (peak + 0.5 - half the
#   length) and with the mean hour; a symmetric spread cannot put the peak of the retired at 10 with
#   a mean of 10.7, the triangular does, and it puts 10 % of the 65+ in shops at 10 h with the time
#   of shopping here, against 8.9 % in the survey. Assumption: at weekends, when nobody has to be
#   anywhere, everybody begins as the inactive do on weekdays (start_mean_weekend,
#   start_peak_weekend); the survey has no weekends.
# The rest of the reasoning for each kind of value:
#   - window: Assumption: the hours in which an outing can begin, the opening hours: the large food
#     stores 7-20 (Saturday 8-18), offices, surgeries and post offices 7-18 (Saturday mornings),
#     restaurants in the evening (longer at weekends), sports and walks 6-21, culture, clubs and
#     meetings 9-22, visits 10-21;
#   - duration_shape: Assumption: 3 gives a moderate spread (a few much longer than the mean);
#   - favourites: Assumption: how many regular places a person has: 3 shops, 3 restaurants, 3
#     services, 2 outdoor places, 2 places of culture, 3 families or friends;
#   - mean_regulars: how many people use the same place. Derived for shops and restaurants: the
#     number of places a person knows times the people per place: shops, over 100 thousand in
#     Czechia (https://ipodpora.odbory.info/soubory/dms/wysiwyg_uploads/a05b113e9f39c8af/uploads/Informace-o-kompletnim-CENSU-maloobchodni-site-a-MIKROCENSU-maloobchodni-site-a-stravovani.pdf),
#     are one per 105 people, so 3 * 105 = 315; restaurants and bars, 48,837 enterprises in 2019
#     (Eurostat sbs_sc_1b_se_r2, I56), are one per 218 people, so 3 * 218 = 654. Assumption for an
#     outdoor place (400), a service (315, as many as shops) and a place of culture (800: cinemas,
#     halls, churches and club rooms are fewer and larger);
#   - size_sigma, distance_scale, age_scale: Model parameters (spread of the sizes of places,
#     distance decay of the choice, how strongly places keep to one age group, spread of space per
#     person); age_scale is large for shops and services (40, everybody uses them), small for
#     restaurants (14), culture (20) and visits (12, friends are of similar age);
#   - area_mean: Assumption: space per person present at the busiest hour: 9 m2 in a shop, 2.5 m2 in
#     a restaurant (tables are close), 60 m2 outdoors (open space), 5 m2 at a service (counters and
#     waiting rooms), 2 m2 at culture and meetings (rows of seats, club rooms). The occupancy tables
#     of the Czech fire-safety standards (CSN 73 0818) give design maxima for such rooms but could
#     not be opened; they would replace these values;
#   - presence_share: the share of the regulars present at the busiest hour, which sets the floor
#     space of a place. Derived: it is measured from the schedules themselves (the test
#     test_presence_shares_are_the_measured_ones keeps it true).
# kind "site": regulars choose favourite places (mean number of regulars, spread of sizes, distance
# decay, age scale in years, space per person present, share of regulars present at once).
# kind "visit": people visit the homes of friends and relatives, similar in age and nearby.
# probability: chance per day as [weekday, weekend], by role, multiplied by personal sociability.
#   Children under `accompanied_under` go with their guardian, so the rows of infants and preschool
#   children hardly matter; residents of care homes stay in and are visited.
