[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epidemic-sandbox"
version = "0.2.0"
description = "Agent-based sandbox for modelling the spread of multiple diseases in a population"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "numba>=0.63",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2",
    "ruff>=0.6",
]

[project.scripts]
epidemic-sandbox = "epidemic_sandbox.app.server:main"

[tool.setuptools.packages.find]
include = ["epidemic_sandbox*"]

[tool.setuptools.package-data]
epidemic_sandbox = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
